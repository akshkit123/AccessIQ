<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessIQ - Account Registration</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-body: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-input: #FFFFFF;
            --border-color: #E2E8F0;
            --accent-blue: #2563EB;
            --accent-cyan: #0284C7;
            --accent-green: #10B981;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.06) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(2, 132, 199, 0.05) 0%, transparent 50%);
        }

        .register-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.25rem 2rem;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        }

        .badge-terminal {
            background: linear-gradient(135deg, #2563EB, #0284C7);
            color: white;
            font-weight: 700;
            padding: 0.45rem 0.95rem;
            border-radius: 10px;
            letter-spacing: 0.5px;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            background-color: #F1F5F9;
            padding: 0.35rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .role-btn {
            border: none;
            background: transparent;
            padding: 0.65rem 0.5rem;
            border-radius: 9px;
            font-weight: 600;
            font-size: 0.92rem;
            color: #64748B;
            transition: all 0.2s ease;
            text-align: center;
            cursor: pointer;
        }

        .role-btn.active {
            background-color: #FFFFFF;
            color: #0F172A;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .form-control-custom, .form-select-custom {
            background-color: var(--bg-input);
            border: 1px solid #CBD5E1;
            color: #0F172A;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.96rem;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus, .form-select-custom:focus {
            background-color: #FFFFFF;
            border-color: var(--accent-blue);
            color: #0F172A;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-portal {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            border: 1px solid #2563EB;
            color: white;
            font-weight: 700;
            border-radius: 12px;
            padding: 0.85rem;
            font-size: 1.02rem;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-portal:hover {
            background: linear-gradient(135deg, #1D4ED8, #1E40AF);
            color: white;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="register-card">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="mb-2">
                <span class="badge-terminal">
                    <i class="bi bi-shield-lock-fill fs-5"></i> AccessIQ Security Registration
                </span>
            </div>
            <h4 class="fw-bold mb-1 text-dark">Create Account</h4>
            <p class="text-muted small mb-0">Select your role to access the relevant security dashboard</p>
        </div>

        {% if error_message %}
            <div class="alert alert-danger py-2 px-3 small rounded-3 border-0 mb-3" style="background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA !important;">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error_message }}
            </div>
        {% endif %}

        <!-- Registration Form -->
        <form method="POST" action="{% url 'portal_register' %}" id="registerForm">
            {% csrf_token %}
            <input type="hidden" name="role" id="roleInput" value="SECURITY_STAFF">

            <!-- Role Selector Tabs -->
            <div class="role-selector">
                <button type="button" class="role-btn active" id="btnRoleBouncer" onclick="setRole('SECURITY_STAFF')">
                    <i class="bi bi-shield-check me-1"></i> Security Staff / Bouncer
                </button>
                <button type="button" class="role-btn" id="btnRoleAdmin" onclick="setRole('ADMIN')">
                    <i class="bi bi-gear-fill me-1"></i> Administrator
                </button>
            </div>

            <!-- Name Fields -->
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">First Name</label>
                    <input type="text" name="first_name" class="form-control form-control-custom" placeholder="e.g. Rajesh" required>
                </div>
                <div class="col-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Last Name</label>
                    <input type="text" name="last_name" class="form-control form-control-custom" placeholder="e.g. Sharma" required>
                </div>
            </div>

            <!-- Username & Email -->
            <div class="mb-3">
                <label class="form-label text-secondary small text-uppercase fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-secondary" style="border-color: #CBD5E1;">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="username" class="form-control form-control-custom border-start-0" placeholder="e.g. officer_sharma" required autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small text-uppercase fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-secondary" style="border-color: #CBD5E1;">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" name="email" class="form-control form-control-custom border-start-0" placeholder="e.g. sharma@campus.edu">
                </div>
            </div>

            <!-- Bouncer Specific Fields -->
            <div id="bouncerFields">
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label text-secondary small text-uppercase fw-semibold">Badge Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-secondary" style="border-color: #CBD5E1;">
                                <i class="bi bi-patch-check"></i>
                            </span>
                            <input type="text" name="badge_number" class="form-control form-control-custom border-start-0" placeholder="e.g. SEC-105">
                        </div>
                    </div>
                    <div class="col-6">
                        <label class="form-label text-secondary small text-uppercase fw-semibold">Stationed Gate</label>
                        <input type="text" class="form-control form-control-custom bg-light" value="College Main Gate" readonly>
                        <input type="hidden" name="location_id" value="{{ default_location.id|default:'' }}">
                    </div>
                </div>
            </div>

            <!-- Password Fields -->
            <div class="row g-2 mb-4">
                <div class="col-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control form-control-custom" placeholder="Min. 6 chars" required autocomplete="new-password">
                </div>
                <div class="col-6">
                    <label class="form-label text-secondary small text-uppercase fw-semibold">Confirm Password</label>
                    <input type="password" name="password_confirm" class="form-control form-control-custom" placeholder="Repeat password" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn btn-portal w-100 mb-3" id="submitBtn">
                <i class="bi bi-person-plus-fill me-2"></i> REGISTER AS SECURITY OFFICER
            </button>
        </form>

        <div class="text-center pt-2 border-top" style="border-color: #E2E8F0 !important;">
            <p class="text-muted small mb-0">
                Already have an account? 
                <a href="{% url 'bouncer_login' %}" class="fw-semibold text-primary text-decoration-none">
                    Sign in here <i class="bi bi-arrow-right"></i>
                </a>
            </p>
        </div>
    </div>

    <script>
        function setRole(role) {
            document.getElementById('roleInput').value = role;
            const bouncerBtn = document.getElementById('btnRoleBouncer');
            const adminBtn = document.getElementById('btnRoleAdmin');
            const bouncerFields = document.getElementById('bouncerFields');
            const submitBtn = document.getElementById('submitBtn');

            if (role === 'ADMIN') {
                adminBtn.classList.add('active');
                bouncerBtn.classList.remove('active');
                bouncerFields.style.display = 'none';
                submitBtn.innerHTML = '<i class="bi bi-person-plus-fill me-2"></i> REGISTER AS ADMINISTRATOR';
            } else {
                bouncerBtn.classList.add('active');
                adminBtn.classList.remove('active');
                bouncerFields.style.display = 'block';
                submitBtn.innerHTML = '<i class="bi bi-person-plus-fill me-2"></i> REGISTER AS SECURITY OFFICER';
            }
        }
    </script>
</body>
</html>
